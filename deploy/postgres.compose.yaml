services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-challenge-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-challenge} -d ${POSTGRES_DB:-backend_challenge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-challenge}:${POSTGRES_PASSWORD:-challenge-local-only}@postgres:5432/${POSTGRES_DB:-backend_challenge}?sslmode=disable
    command:
      - up

volumes:
  postgres_data:
